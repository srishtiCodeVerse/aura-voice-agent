<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura - Skincare AI Assistant</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fceff6, #f5effb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 600px;
            max-width: 95%;
            height: 850px;
            max-height: 95vh;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(100, 60, 100, 0.18);
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg, #df94b0, #b991d3);
            color: white;
            padding: 24px 28px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 17px;
        }

        .online {
            margin-top: 12px;
            font-size: 14px;
        }

        .online::before {
            content: "●";
            margin-right: 6px;
        }

        /* CHAT */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #fff;
        }

        .message {
            max-width: 82%;
            padding: 16px 18px;
            margin-bottom: 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }

        .bot {
            background: #f1ebf6;
            color: #222;
            border-top-left-radius: 5px;
        }

        .user {
            background: #d889a7;
            color: white;
            margin-left: auto;
            border-top-right-radius: 5px;
        }

        .typing {
            background: #f1ebf6;
            color: #555;
            font-style: italic;
        }

        /* QUICK BUTTONS */

        .quick-buttons {
            display: flex;
            gap: 10px;
            padding: 12px 18px;
            overflow-x: auto;
            border-top: 1px solid #eee;
        }

        .quick-buttons button {
            flex-shrink: 0;
            border: 1px solid #efd4e0;
            background: #fff7fa;
            color: #222;
            border-radius: 25px;
            padding: 11px 17px;
            cursor: pointer;
            font-size: 15px;
        }

        .quick-buttons button:hover {
            background: #f8e1eb;
        }

        /* VOICE STATUS */

        .voice-status {
            text-align: center;
            min-height: 22px;
            padding: 3px 10px;
            color: #b06b8b;
            font-size: 13px;
        }

        /* INPUT */

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #eee;
            background: white;
        }

        #messageInput {
            flex: 1;
            height: 54px;
            border: 1px solid #ddd;
            border-radius: 28px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #d889a7;
        }

        .icon-button {
            width: 54px;
            height: 54px;
            border: none;
            border-radius: 50%;
            background: #c783a3;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-button:hover {
            background: #b86f92;
        }

        .mic-active {
            background: #e74c3c !important;
        }

        .speaking {
            background: #8e72b5 !important;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .app {
                width: 100%;
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 28px;
            }

            .message {
                max-width: 88%;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <h1>✨ Aura</h1>

        <p>Your AI Skincare Assistant</p>

        <div class="online">
            Online
        </div>

    </div>


    <!-- CHAT -->

    <div
        class="chat-container"
        id="chatContainer"
    >

        <div class="message bot">

            Hi! I'm Aura 🌸

            <br><br>

            I can help you with skincare questions
            and order information.

            You can also talk to me using the
            microphone 🎙️

        </div>

    </div>


    <!-- QUICK BUTTONS -->

    <div class="quick-buttons">

        <button
            onclick="quickMessage('Where is my order ORD-103?')"
        >
            📦 Order ORD-103
        </button>


        <button
            onclick="quickMessage('What is a good skincare routine for oily skin?')"
        >
            🌿 Oily skin
        </button>


        <button
            onclick="quickMessage('How can I take care of dry skin?')"
        >
            💧 Dry skin
        </button>

    </div>


    <!-- VOICE STATUS -->

    <div
        class="voice-status"
        id="voiceStatus"
    ></div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask Aura something..."
            autocomplete="off"
        >


        <button
            class="icon-button"
            id="micButton"
            onclick="startVoiceInput()"
            title="Speak to Aura"
        >
            🎙️
        </button>


        <button
            class="icon-button"
            id="sendButton"
            onclick="sendMessage()"
            title="Send"
        >
            ➤
        </button>

    </div>

</div>


<script>

    /* =========================================
       AURA CONFIGURATION
    ========================================= */

const API_URL = "https://aura-voice-agent-bm5f.onrender.com/chat";
    const chatContainer =
        document.getElementById("chatContainer");

    const messageInput =
        document.getElementById("messageInput");

    const micButton =
        document.getElementById("micButton");

    const sendButton =
        document.getElementById("sendButton");

    const voiceStatus =
        document.getElementById("voiceStatus");


    /* =========================================
       SPEECH VARIABLES
    ========================================= */

    let recognition = null;

    let isListening = false;

    let isSpeaking = false;


    /* =========================================
       ADD MESSAGE
    ========================================= */

    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.classList.add(
            "message"
        );

        if (type === "user") {

            message.classList.add(
                "user"
            );

        } else {

            message.classList.add(
                "bot"
            );

        }

        message.textContent = text;

        chatContainer.appendChild(
            message
        );

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

        return message;
    }


    /* =========================================
       THINKING MESSAGE
    ========================================= */

    function showTyping() {

        const message =
            document.createElement("div");

        message.classList.add(
            "message",
            "bot",
            "typing"
        );

        message.id =
            "typingMessage";

        message.textContent =
            "Thinking... 🤔";

        chatContainer.appendChild(
            message
        );

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {

            typing.remove();

        }
    }


    /* =========================================
       GET AVAILABLE VOICES
    ========================================= */

    function getVoice() {

        const voices =
            window.speechSynthesis.getVoices();

        if (!voices.length) {

            return null;

        }

        /*
           Prefer Indian English.
        */

        let voice =
            voices.find(function(v) {

                return v.lang === "en-IN";

            });


        if (!voice) {

            voice =
                voices.find(function(v) {

                    return v.lang
                        .toLowerCase()
                        .startsWith("en-in");

                });

        }


        if (!voice) {

            voice =
                voices.find(function(v) {

                    return v.lang
                        .toLowerCase()
                        .startsWith("en");

                });

        }


        return voice || voices[0];

    }


    /* =========================================
       AURA TEXT TO SPEECH
    ========================================= */

    function speakAura(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            voiceStatus.textContent =
                "Speech is not supported in this browser.";

            console.error(
                "speechSynthesis is not supported."
            );

            return;

        }


        /*
           Stop any previous speech.
        */

        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        /*
           Voice settings.
        */

        speech.lang = "en-IN";

        speech.rate = 0.9;

        speech.pitch = 1;

        speech.volume = 1;


        /*
           Select available voice.
        */

        const voice =
            getVoice();


        if (voice) {

            speech.voice =
                voice;

        }


        /*
           Speaking started.
        */

        speech.onstart =
            function() {

                isSpeaking = true;

                micButton.classList.add(
                    "speaking"
                );

                voiceStatus.textContent =
                    "🔊 Aura is speaking...";

                console.log(
                    "AURA SPEAKING"
                );

            };


        /*
           Speaking finished.
        */

        speech.onend =
            function() {

                isSpeaking = false;

                micButton.classList.remove(
                    "speaking"
                );

                voiceStatus.textContent =
                    "";

                console.log(
                    "AURA FINISHED SPEAKING"
                );

            };


        /*
           Speech error.
        */

        speech.onerror =
            function(event) {

                isSpeaking = false;

                micButton.classList.remove(
                    "speaking"
                );

                voiceStatus.textContent =
                    "Speech error. Please try again.";

                console.error(
                    "AURA SPEECH ERROR:",
                    event.error
                );

            };


        /*
           Resume speech engine.
        */

        window.speechSynthesis.resume();


        /*
           Speak.
        */

        window.speechSynthesis.speak(
            speech
        );

    }


    /* =========================================
       LOAD BROWSER VOICES
    ========================================= */

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.onvoiceschanged =
            function() {

                const voices =
                    window.speechSynthesis.getVoices();

                console.log(
                    "Available voices:",
                    voices
                );

            };

    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (!message) {

            return;

        }


        /*
           Display customer message.
        */

        addMessage(
            message,
            "user"
        );


        /*
           Clear input.
        */

        messageInput.value =
            "";


        /*
           Show thinking.
        */

        showTyping();


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message:
                                message
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned " +
                    response.status
                );

            }


            const data =
                await response.json();


            /*
               Remove thinking.
            */

            removeTyping();


            /*
               Display Aura response.
            */

            if (data.reply) {

                addMessage(
                    data.reply,
                    "bot"
                );


                /*
                   Speak Aura response.
                */

                setTimeout(
                    function() {

                        speakAura(
                            data.reply
                        );

                    },
                    100
                );


            } else {

                addMessage(
                    "Sorry, I didn't receive a response from Aura. 😕",
                    "bot"
                );

            }


        } catch (error) {

            console.error(
                "Connection error:",
                error
            );


            removeTyping();


            addMessage(
                "I can't connect to the Aura server. Please make sure the backend is running.",
                "bot"
            );

        }

    }


    /* =========================================
       QUICK BUTTONS
    ========================================= */

    function quickMessage(message) {

        messageInput.value =
            message;

        sendMessage();

    }


    /* =========================================
       ENTER KEY
    ========================================= */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================
       MICROPHONE / SPEECH RECOGNITION
    ========================================= */

    function startVoiceInput() {

        /*
           If Aura is speaking,
           stop her.
        */

        if (isSpeaking) {

            window.speechSynthesis.cancel();

            isSpeaking = false;

            micButton.classList.remove(
                "speaking"
            );

            voiceStatus.textContent =
                "";

            return;

        }


        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Voice recognition is not supported. Please use Google Chrome."
            );

            return;

        }


        /*
           Prevent duplicate recognition.
        */

        if (isListening) {

            if (recognition) {

                recognition.stop();

            }

            return;

        }


        /*
           Create recognition.
        */

        recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-IN";


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        /*
           Recognition started.
        */

        recognition.onstart =
            function() {

                isListening = true;

                micButton.classList.add(
                    "mic-active"
                );

                voiceStatus.textContent =
                    "🎙️ Listening...";

                messageInput.placeholder =
                    "Listening...";

            };


        /*
           Speech recognized.
        */

        recognition.onresult =
            function(event) {

                const transcript =
                    event
                        .results[0][0]
                        .transcript;


                messageInput.value =
                    transcript;


                voiceStatus.textContent =
                    "Processing...";


                /*
                   Send voice message.
                */

                sendMessage();

            };


        /*
           Recognition error.
        */

        recognition.onerror =
            function(event) {

                console.error(
                    "Speech recognition error:",
                    event.error
                );


                voiceStatus.textContent =
                    "Voice recognition error. Try again.";

            };


        /*
           Recognition ended.
        */

        recognition.onend =
            function() {

                isListening =
                    false;


                micButton.classList.remove(
                    "mic-active"
                );


                messageInput.placeholder =
                    "Ask Aura something...";


                setTimeout(
                    function() {

                        if (
                            !isSpeaking
                        ) {

                            voiceStatus.textContent =
                                "";

                        }

                    },
                    1200
                );

            };


        /*
           Start microphone.
        */

        try {

            recognition.start();

        } catch (error) {

            console.error(
                "Microphone start error:",
                error
            );

        }

    }


    /* =========================================
       PAGE READY
    ========================================= */

    window.addEventListener(
        "load",
        function() {

            /*
               Load voices.
            */

            if (
                "speechSynthesis" in window
            ) {

                window.speechSynthesis
                    .getVoices();

            }

        }
    );

</script>

</body>

</html>
